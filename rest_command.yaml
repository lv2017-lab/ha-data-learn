# File nay de DAT TEN la rest_command.yaml trong thu muc /homeassistant
# (cung cho voi configuration.yaml), khi configuration.yaml co dong:
#   rest_command: !include rest_command.yaml
# Vi la file include nen KHONG co khoa "rest_command:" o dau file.
# Thay IP-HASS bang IP LAN cua chinh may HAOS (IP ban mo HA trong mang LAN,
# khong phai ten mien tenmien.io.vn). Neu add-on khong dat token thi giu nguyen
# cac dong comment headers. Neu co dat token thi xoa dau # o 2 dong headers.

print_learn_save:
  url: "http://IP-HASS:8765/learn"
  method: post
  content_type: "application/json"
  #headers:
  #  X-Token: "doi-thanh-token-cua-ban"
  payload: '{{ {"code": code, "text": text, "group_id": group_id} | tojson }}'

print_learn_lookup:
  url: "http://IP-HASS:8765/lookup?code={{ code }}&group_id={{ group_id }}"
  method: get
  #headers:
  #  X-Token: "doi-thanh-token-cua-ban"

print_learn_delete:
  url: "http://IP-HASS:8765/learn?code={{ code }}&group_id={{ group_id }}"
  method: delete
  #headers:
  #  X-Token: "doi-thanh-token-cua-ban"

print_log_save:
  url: "http://IP-HASS:8765/log"
  method: post
  content_type: "application/json"
  #headers:
  #  X-Token: "doi-thanh-token-cua-ban"
  payload: '{{ {"device": device, "position": position, "machine": machine, "note": note, "date": date, "group_id": group_id} | tojson }}'

print_log_query:
  url: "http://IP-HASS:8765/logs?q={{ q | urlencode }}&limit=10&group_id={{ group_id }}"
  method: get
  #headers:
  #  X-Token: "doi-thanh-token-cua-ban"

print_log_update:
  url: "http://IP-HASS:8765/log/update"
  method: post
  content_type: "application/json"
  #headers:
  #  X-Token: "doi-thanh-token-cua-ban"
  payload: '{{ {"id": id, "device": device, "position": position, "machine": machine, "note": note, "date": date} | tojson }}'

print_log_delete_id:
  url: "http://IP-HASS:8765/log?id={{ id }}"
  method: delete
  #headers:
  #  X-Token: "doi-thanh-token-cua-ban"

print_log_delete_date:
  url: "http://IP-HASS:8765/logs?date={{ date | urlencode }}&group_id={{ group_id }}"
  method: delete
  #headers:
  #  X-Token: "doi-thanh-token-cua-ban"

