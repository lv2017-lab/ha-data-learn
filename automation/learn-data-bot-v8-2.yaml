          2. Kiểm tra Drive đã Ready chưa.
          3. Kiểm tra lệnh cảm biến có phát quá sớm không.
          4. Kiểm tra dây encoder.
          5. Kiểm tra gạch có vật cản Barrier không.
          6. Nếu vẫn lỗi, liên hệ KTV.
        E98: |
