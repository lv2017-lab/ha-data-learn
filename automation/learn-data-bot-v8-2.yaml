                  content: '{{ rem_content }}'
                  remind_at: '{{ rem_ts }}'
                response_variable: rem_save_resp
                continue_on_error: true
              - variables:
                  rem_confirm: >-
                    {% if rem_save_resp is defined and rem_save_resp.status == 200 %}Dạ, em đã đặt lịch nhắc: {{ rem_when }} — {{ rem_content }} ạ. Đúng giờ em sẽ nhắn vào nhóm nhắc anh nhé.{% else %}Dạ, em chưa đặt được lịch — máy chủ dữ liệu chưa chạy hoặc HA chưa nạp rest_command mới. Anh thử lại sau ít phút giúp em nhé.{% endif %}
              - action: zalo_bot.send_message
                data:
                  type: '1'
                  thread_id: '{{ reply_thread_id }}'
                  account_selection: '+84xxxxxxxx'
                  message: '{{ rem_confirm }}'
            else:
              - action: zalo_bot.send_message
                data:
                  type: '1'
                  thread_id: '{{ reply_thread_id }}'
                  account_selection: '+84xxxxxxxx'
                  message: >-
                    Dạ, anh nhắn kiểu "Lyly nhắc tôi 9h uống nước" hoặc "Lyly
                    nhắc tôi sau 30 phút kiểm tra máy" nhé.
      - conditions:
          - condition: template
            value_template: '{{ is_reminder_list }}'
        sequence:
          - action: rest_command.reminders_list
            data:
              group_id: '{{ reply_thread_id }}'
            response_variable: rem_list_resp
            continue_on_error: true
          - variables:
              rem_list_text: >-
                {% if rem_list_resp is defined and rem_list_resp.status == 200 and rem_list_resp.content is mapping and rem_list_resp.content.get('items') %}{% set ns = namespace(lines=['Dạ, các lịch hẹn sắp tới của nhóm mình ạ:']) %}{% for it in rem_list_resp.content.get('items') %}{% set ns.lines = ns.lines + ['• #' ~ it['id'] ~ ' — ' ~ (it['remind_at'] | timestamp_custom('%H:%M %d/%m/%Y')) ~ ': ' ~ it['content']] %}{% endfor %}{% set ns.lines = ns.lines + ['Muốn hủy lịch nào anh nhắn "Lyly hủy lịch #<số>" nhé.'] %}{{ ns.lines | join('\n') }}{% else %}Dạ, nhóm mình chưa có lịch hẹn nào đang chờ ạ. Anh nhắn "Lyly nhắc tôi 9h uống nước" để đặt lịch nhé.{% endif %}
          - action: zalo_bot.send_message
            data:
              type: '1'
              thread_id: '{{ reply_thread_id }}'
              account_selection: '+84xxxxxxxx'
              message: '{{ rem_list_text }}'

      - conditions:
          - condition: template
            value_template: '{{ learned_message != '''' }}'
        sequence:
          - action: zalo_bot.send_message
            data:
              type: '1'
              thread_id: '{{ reply_thread_id }}'
              account_selection: '+84xxxxxxxx'
              message: '{{ learned_message }}'
      - conditions:
          - condition: template
            value_template: '{{ reply | trim != '''' }}'
        sequence:
          - action: zalo_bot.send_message
            data:
              type: '1'
              thread_id: '{{ reply_thread_id }}'
              account_selection: '+84xxxxxxxx'
              message: '{{ reply | trim }}'
    default:
      - condition: template
        value_template: '{{ is_called }}'
      - action: conversation.process
        data:
          text: >
            Bạn là {{ bot_name }}, trợ lý AI thân thiện trong nhóm Zalo.


            CÂU HỎI:

            {{ user_message }}


            DỮ LIỆU ĐÃ HỌC CHO MÃ XUẤT HIỆN TRONG CÂU (nếu có thì ưu tiên dùng,
            nó mới hơn kiến thức chung):

            {{ learned_message }}


            {{ ai_ctx }}


            QUY TẮC TRẢ LỜI:

            0. PHONG CÁCH BẮT BUỘC: nói năng nhẹ nhàng, ngọt ngào, lễ phép
            kiểu miền Nam: mở đầu bằng "Dạ", xưng "em", gọi người hỏi là
            "anh" (chỉ gọi "anh", không dùng "anh/chị") khi hợp ngữ cảnh, dùng dạ/vâng. Chỉ trả lời ĐÚNG chủ
            đề được hỏi, NGẮN GỌN, súc tích (thường dưới 120 từ), không
            lan man, không lặp lại câu hỏi, không trả lời sang chuyện
            khác.

            1. Trả lời trực tiếp, ngắn gọn, đúng trọng tâm, phù hợp gửi lên
            Zalo.

            2. Có thể trả lời mọi lĩnh vực: kỹ thuật, điện, điện tử, PLC, tự
            động hóa, cơ khí, máy in, IT, lập trình, mạng, AI, khoa học, toán,
            lịch sử, địa lý, đời sống, dịch thuật, viết nội dung...

            3. Câu hỏi kỹ thuật: hướng dẫn từng bước, dễ thực hiện.

            4. Câu hỏi tính toán: nêu công thức, phép tính và kết quả.

            5. Câu hỏi so sánh: trình bày rõ ràng, có thể dùng bảng.

            6. Chỉ trả lời bằng thông tin chắc chắn. Nếu thật sự không trả lời được thì nói ngắn gọn "Dạ, phần này em chưa rõ ạ" — không hỏi ngược lại, không xin thêm chi tiết.

            7. Không tự bịa, không suy đoán. Chi tiết nào không chắc chắn thì bỏ qua hẳn, không nêu ra trong câu trả lời.

            8. Với điện, máy móc, hóa chất hoặc thiết bị nguy hiểm: luôn đưa
            cảnh báo an toàn phù hợp.

            9. Không nhắc lại @Aibot, không chào hỏi dài dòng.
          agent_id: conversation.gemini_tu_dong_ai_agent
          conversation_id: 'print-{{ reply_thread_id }}-{{ mem_epoch }}'
        response_variable: ai_response
      - variables:
          ai_message: >
            {{ ai_response.response.speech.plain.speech | default('') | string |
            trim }}
      - condition: template
        value_template: '{{ ai_message != '''' }}'
      - action: zalo_bot.send_message
        data:
          type: '1'
          thread_id: '{{ reply_thread_id }}'
          account_selection: '+84xxxxxxxx'
          message: '{{ ai_message }}'
mode: queued
max: 10