          3. Kiểm tra cấu hình PLC.
          4. Nếu không khắc phục được, liên hệ KTV để đánh giá tình trạng máy.
        E195: |
          ⚠️ E195 – Không thể truy xuất file cài đặt máy.

          🔧 Hướng xử lý:
          1. Kiểm tra file cấu hình máy.
          2. Máy sẽ sử dụng file cấu hình mặc định.
          3. Nếu lỗi lặp lại, liên hệ KTV để kiểm tra hệ thống.
        E196: |
          ⚠️ E196 – Card FirePulse không được đặt/không được nhận.

          🔧 Hướng xử lý:
          1. Kiểm tra card FirePulse.
          2. Kiểm tra vị trí lắp card và kết nối.
          3. Kiểm tra nguồn và giao tiếp.
          4. Nếu card không được nhận, liên hệ KTV.
        E198: |
          ⚠️ E198 – Không thể hoàn thành thao tác do đang có cảnh báo.

          🔧 Hướng xử lý:
          1. Kiểm tra các cảnh báo hiện tại.
          2. Xử lý nguyên nhân của cảnh báo.
          3. Sau khi hết cảnh báo, thực hiện lại thao tác.
        E199: |
          ⚠️ E199 – Không thể gửi lệnh.

          🔧 Hướng xử lý:
          1. Xem chi tiết cảnh báo bổ sung để xác định lệnh nào không được gửi.
          2. Xử lý cảnh báo liên quan.
          3. Thực hiện lại lệnh.
        E200: >
          ⚠️ E200 – Số lượng card Sapphire không tương ứng với số lượng cần
          thiết.


          🔧 Hướng xử lý:

          1. Kiểm tra số lượng card Sapphire.

          2. Kiểm tra card có được nhận đúng không.

          3. Nếu thiếu/hỏng card, liên hệ KTV để thay thế.
        E201: |
          ⚠️ E201 – Hộp mực không được đưa vào hoặc không thể kích hoạt.

          🔧 Hướng xử lý:
          1. Lắp hộp mực đúng vị trí.
          2. Kiểm tra cảm biến phát hiện hộp mực.
          3. Kiểm tra hoạt động của cảm biến.
          4. Kiểm tra trạng thái Tickle/HeadFires nếu liên quan.
        E202: |
          ⚠️ E202 – Phát hiện thiết bị có danh tính không hợp lệ trong EtherCAT.

          🔧 Hướng xử lý:
          1. Kiểm tra thiết bị EtherCAT.
          2. Kiểm tra cấu hình/ID thiết bị.
          3. Kiểm tra thiết bị có bị thay thế hoặc cấu hình sai không.
          4. Nếu không khắc phục được, liên hệ KTV.
        E203: |
          ⚠️ E203 – Kết nối EtherCAT không chính xác.

          🔧 Hướng xử lý:
          1. Kiểm tra dây EtherCAT.
          2. Kiểm tra đầu nối và thứ tự kết nối.
          3. Kiểm tra trạng thái các thiết bị EtherCAT.
          4. Nếu không được, liên hệ KTV.
        E204: |
          ⚠️ E204 – IO bị khóa sau khi EtherCAT thất bại.

          🔧 Hướng xử lý:
          1. Kiểm tra nguyên nhân EtherCAT.
          2. Khắc phục lỗi EtherCAT.
          3. Reset/khởi động lại theo quy trình.
          4. Nếu vẫn lỗi, liên hệ KTV.
        E205: |
          ⚠️ E205 – EtherCAT: Thất bại dự phòng.

          🔧 Hướng xử lý:
          1. Kiểm tra kết nối EtherCAT.
          2. Kiểm tra thiết bị và đầu nối.
          3. Nếu vẫn lỗi, liên hệ KTV.
        E206: |
          ⚠️ E206 – EtherCAT: Khung bị thiếu.

          🔧 Hướng xử lý:
          1. Kiểm tra cáp EtherCAT.
          2. Kiểm tra đầu nối.
          3. Kiểm tra thiết bị có mất kết nối không.
          4. Nếu vẫn lỗi, liên hệ KTV.
        E207: |
          ⚠️ E207 – EtherCAT: Không gửi được thông tin do thiếu tài nguyên.

          🔧 Hướng xử lý:
          1. Kiểm tra trạng thái EtherCAT.
          2. Kiểm tra thiết bị và tài nguyên giao tiếp.
          3. Nếu vẫn lỗi, liên hệ KTV.
        E208: |
          ⚠️ E208 – EtherCAT: Lỗi giám sát.

          🔧 Hướng xử lý:
          1. Kiểm tra trạng thái EtherCAT.
          2. Kiểm tra các thiết bị đầu cuối.
          3. Kiểm tra cáp và đầu nối.
          4. Nếu lỗi lặp lại, liên hệ KTV.
        E209: |
          ⚠️ E209 – Không tìm thấy trình điều khiển Ethernet.

          🔧 Hướng xử lý:
          1. Kiểm tra Ethernet.
          2. Kiểm tra driver và card mạng.
          3. Kiểm tra kết nối với PLC/hệ thống.
          4. Nếu vẫn lỗi, liên hệ KTV.
        E210: |
          ⚠️ E210 – EtherCAT: Lỗi IO, thiết lập lại kích hoạt.

          🔧 Hướng xử lý:
          1. Kiểm tra EtherCAT.
          2. Kiểm tra IO.
          3. Reset kích hoạt sau khi xử lý nguyên nhân.
          4. Nếu vẫn lỗi, liên hệ KTV.
        E211: |
          ⚠️ E211 – EtherCAT: Ít nhất một thiết bị đầu cuối đang khởi tạo.

          🔧 Hướng xử lý:
          1. Kiểm tra trạng thái thiết bị EtherCAT.
          2. Chờ thiết bị hoàn tất khởi tạo.
          3. Nếu không chuyển trạng thái, kiểm tra cáp và thiết bị.
        E212: |
          ⚠️ E212 – EtherCAT: Ít nhất một thiết bị đầu cuối ở trạng thái PREOP.

          🔧 Hướng xử lý:
          1. Kiểm tra thiết bị đang ở PREOP.
          2. Kiểm tra kết nối EtherCAT.
          3. Kiểm tra cấu hình thiết bị.
          4. Nếu không được, liên hệ KTV.
        E213: |
          ⚠️ E213 – EtherCAT: Ít nhất một thiết bị đầu cuối ở trạng thái SAFEOP.

          🔧 Hướng xử lý:
          1. Kiểm tra thiết bị đang ở SAFEOP.
          2. Kiểm tra kết nối EtherCAT.
          3. Kiểm tra cấu hình thiết bị.
          4. Nếu không được, liên hệ KTV.
        E214: |
          ⚠️ E214 – EtherCAT: Ít nhất một thiết bị đầu cuối đã thất bại.

          🔧 Hướng xử lý:
          1. Xác định thiết bị EtherCAT bị lỗi.
          2. Kiểm tra cáp và đầu nối.
          3. Kiểm tra thiết bị.
          4. Nếu vẫn lỗi, liên hệ KTV.
        E215: |
          ⚠️ E215 – Lỗi trong quá trình vận hành động cơ.

          🔧 Hướng xử lý:
          1. Kiểm tra động cơ.
          2. Kiểm tra Drive.
          3. Kiểm tra encoder.
          4. Kiểm tra vật cản cơ khí/Barrier.
          5. Nếu không được, liên hệ KTV.
        E216: |
          ⚠️ E216 – Thất bại EtherCAT.

          🔧 Hướng xử lý:
          1. Kiểm tra cáp EtherCAT.
          2. Kiểm tra các đầu nối.
          3. Kiểm tra thiết bị đầu cuối EtherCAT.
          4. Khởi động lại theo quy trình.
          5. Nếu vẫn lỗi, liên hệ KTV.
        E217: |
          ⚠️ E217 – Không thể bắt đầu hoặc hoàn thành bước HeadFires.

          🔧 Hướng xử lý:
          1. Thử lại bước HeadFires.
          2. Kiểm tra khí nén.
          3. Kiểm tra trạng thái các hộp mực/đầu in.
          4. Kiểm tra các cảnh báo liên quan.
          5. Nếu vẫn lỗi, liên hệ KTV.
        E219: |
          ⚠️ E219 – Cảnh báo quá nhiệt.

          🔧 Hướng xử lý:
          1. Kiểm tra nhiệt độ các hộp mực, bình mực và đầu in.
          2. Hệ thống kiểm tra giới hạn nhiệt độ tối đa cho phép khoảng 70°C.
          3. Kiểm tra nguyên nhân gây quá nhiệt.
          4. Chỉ vận hành lại khi nhiệt độ nằm trong giới hạn cho phép.
        E220: |
          ⚠️ E220 – Lỗi cấu hình CoreDigit.

          🔧 Hướng xử lý:
          1. Kiểm tra cấu hình đầu in.
          2. Kiểm tra đầu in hoạt động đầu tiên.
          3. Kiểm tra đầu in hoạt động cuối cùng.
          4. Nếu không được, liên hệ KTV.
        E221: >
          ⚠️ E221 – Giao tiếp với PLC thất bại.


          🔧 Hướng xử lý:

          1. Kiểm tra tín hiệu LAN từ PLC → Switch → Màn hình HMI.

          2. Có thể kiểm tra bằng cách nối trực tiếp dây LAN màu xanh từ PLC →
          màn hình.

          3. Nếu kết nối trực tiếp được thì có khả năng Switch bị hỏng, cần thay
          thế.

          4. Nếu vẫn lỗi, cập nhật PLC theo quy trình và khởi động lại hệ thống.

          5. Nếu không được, liên hệ KTV.
        E225: |
          ⚠️ E225 – Lỗi xảy ra trong PLC.

          🔧 Hướng xử lý:
          1. Kiểm tra PLC.
          2. Kiểm tra các cảnh báo PLC liên quan.
          3. Khởi động lại theo quy trình.
          4. Nếu vẫn lỗi, liên hệ KTV.
        E226: |
          ⚠️ E226 – Máy không ở vị trí in.

          🔧 Hướng xử lý:
          1. Kiểm tra vị trí máy.
          2. Khi chuyển sang Auto, máy sẽ hạ xuống vị trí in và thử lại.
          3. Đảm bảo không có vật cản trước khi hạ đầu in.
        E227: |
          ⚠️ E227 – Lỗi khi chuyển sang trạng thái Tickle.

          🔧 Hướng xử lý:
          1. Xem chi tiết cảnh báo bổ sung trên giao diện.
          2. Xác định card bị lỗi: Sapphire, FirePulse hoặc CoreDigit.
          3. Kiểm tra card và kết nối tương ứng.
        E228: |
          ⚠️ E228 – Cho phép Backup.

          🔧 Hướng xử lý:
          1. Kiểm tra trạng thái CoreDigit.
          2. Kiểm tra các cảnh báo liên quan.
        E229: |
          ⚠️ E229 – Hâm nóng báo động.

          🔧 Hướng xử lý:
          1. Kiểm tra hộp mực, bình mực và đầu in.
          2. Bật hệ thống gia nhiệt.
          3. Chờ nhiệt độ đạt điều kiện cho phép trước khi bắt đầu in.
        E230: |
          ⚠️ E230 – Nhiệt độ gia nhiệt vượt quá mức báo động cho phép.

          🔧 Hướng xử lý:
          1. Kiểm tra nhiệt độ đầu in, bình mực và hộp mực.
          2. Kiểm tra độ lệch so với nhiệt độ mục tiêu.
          3. Kiểm tra hoạt động của hệ thống gia nhiệt.
          4. Điều chỉnh độ lệch tối đa cho phép theo quy trình kỹ thuật.
        E231: |
          ⚠️ E231 – Áp suất trong đầu in không đủ.

          🔧 Hướng xử lý:
          1. Kiểm tra áp suất đầu in.
          2. Kiểm tra bơm và đường ống.
          3. Kiểm tra rò rỉ.
          4. Nếu vẫn lỗi, liên hệ KTV.
        E232: |
          ⚠️ E232 – Lỗi tải waveform.

          🔧 Hướng xử lý:
          1. Thử tải lại waveform.
          2. Kiểm tra tính toàn vẹn dữ liệu waveform trong Sapphire.
          3. Thử thay đổi waveform nếu phù hợp.
          4. Nếu vẫn lỗi, liên hệ KTV.
        E233: >
          ⚠️ E233 – Không thể hoàn tất thao tác đưa máy về vị trí in vì phát
          hiện gạch.


          🔧 Hướng xử lý:

          1. Kiểm tra thực tế có gạch trong vùng máy hay không.

          2. Nếu thực sự không có gạch, kiểm tra trạng thái bản sao trống.

          3. Kiểm tra cảm biến phát hiện gạch.
        E234: |
          ⚠️ E234 – Lỗi điều chỉnh nhiệt độ card Sapphire.

          🔧 Hướng xử lý:
          1. Xem chi tiết cảnh báo để xác định đầu in/bộ phận bị lỗi.
          2. Nếu nhiệt độ đầu in đọc được là 0°C, kiểm tra kết nối cảm biến.
          3. Nếu nhiệt độ bình mực/đĩa mực >200°C, kiểm tra kết nối cảm biến.
          4. Kiểm tra dây và cảm biến nhiệt độ.
        E235: >
          ⚠️ E235 – Lỗi card Fire Pulse Hoặc Sapphire Carrier hoặc Đầu in, 
          thường liên quan FirePulse.


          🔧 Hướng xử lý:

          1. Kiểm tra mã lỗi E/W trên hệ thống CoreDigit bằng cách nhấn chữ G
          trên màn hình hoặc nhấn vào dòng báo lỗi màu đỏ để xem chi tiết.

          2. Nếu báo lỗi mạch công suất FirePulse không hoạt động, kiểm tra card
          FirePulse.

          3. Có thể xuất hiện lỗi Sapphire Head Error / Board / Error Sync FPGA
          Head ( Do card Carrier hoặc Đàu in)

          4. Kiểm tra và thay card FirePulse theo quy trình kỹ thuật nếu xác
          định card hỏng.

          5. Chỉ rút giắc card phía sau tủ điện FirePulse để chạy sản xuất khi
          có quy trình kỹ thuật được phê duyệt.
        E236: >
          ⚠️ E236 – Lỗi card Sapphire Carrier hoặc FirePulse.


          🔧 Hướng xử lý:

          1. Bấm vào chữ G xem chi tiết mã lôi. 

          2. Sapphire Node không kết nối được: Khởi động lại máy; nếu vẫn lỗi,
          liên hệ KTV.

          3. Lỗi ADC SPI: Khởi động lại máy; nếu vẫn lỗi, liên hệ KTV.

          4. Lỗi chương trình XILINX: Khởi động lại máy; nếu vẫn lỗi, liên hệ
          KTV.

          5. Lỗi khởi tạo PWM: Khởi động lại máy; nếu vẫn lỗi, liên hệ KTV.

          6. FPGA LVDS RX: Kiểm tra đường LVDS giữa card lỗi và card trước.

          7. FPGA LVDS NEXT: Kiểm tra đường LVDS giữa card lỗi và card tiếp
          theo.

          8. Lỗi lưu dữ liệu vào Flash: Khởi động lại máy; nếu vẫn lỗi, liên hệ
          KTV.

          9. Mất waveform: Thử lại thao tác Auto; nếu vẫn lỗi, liên hệ KTV.

          10. Không có FirePulse: Thử lại thao tác Auto; nếu vẫn lỗi, liên hệ
          KTV.

          11. Chỉ bỏ tích E236 trong Config khi có quy trình kỹ thuật cho phép.

          12. Nếu card hỏng, thay card mới theo quy trình.
        E237: |
          ⚠️ E237 – Lỗi giao tiếp Sapphire Carrier, FirePulse và DSP.

          🔧 Hướng xử lý:
          1. Reset tất cả các nút trên card Carrier.
          2. Kiểm tra kết nối giữa Carrier, FirePulse và DSP.
          3. ⚠️ Không được tắt nguồn khi chưa có quy trình xử lý phù hợp.
          4. Nếu vẫn lỗi, liên hệ KTV để kiểm tra/thay thế.
        E238: >
          ⚠️ E238 – Giao diện CAN không chính xác.


          🔧 Hướng xử lý:

          1. Kiểm tra cáp mạng CAN.

          2. Kiểm tra tất cả đầu nối CAN đã cắm đúng chưa.

          3. Kiểm tra trở kháng đường CAN, giá trị tham chiếu 60 Ohm.

          4. Kiểm tra bộ điều khiển CAN.

          5. Kiểm tra phiên bản phần mềm EL6751 nếu có cảnh báo liên quan.

          6. Cập nhật module theo phiên bản được System phát hành nếu được yêu
          cầu.
        E240: |
          ⚠️ E240 – Không có nguồn điện chính.

          🔧 Hướng xử lý:
          1. Kiểm tra nguồn điện chính.
          2. Kiểm tra aptomat/CB và nguồn cấp máy.
          3. Kiểm tra các nguồn phụ liên quan.
          4. Chỉ thao tác điện khi đã cô lập nguồn và đảm bảo an toàn.
        E241: |
          ⚠️ E241 – Địa chỉ IP bị trùng do cài đặt card sai.

          🔧 Hướng xử lý:
          1. Kiểm tra các địa chỉ IP trong Ethernet nội bộ.
          2. Xác định card có IP trùng.
          3. Kiểm tra card có bị cấu hình sai không.
          4. Nếu card không thể cấu hình đúng, kiểm tra khả năng card bị hỏng.
          5. Chỉnh IP đúng theo cấu hình hệ thống.
        E243: |
          ⚠️ E243 – Lượng phủ/khí thải mực nằm ngoài phạm vi.

          🔧 Hướng xử lý:
          1. Kiểm tra giá trị lượng phủ.
          2. Đặt giá trị trong phạm vi cho phép.
          3. Có thể điều chỉnh tốc độ phù hợp.
        E244: >
          ⚠️ E244 – Tần suất hoạt động quá cao.


          🔧 Hướng xử lý:

          1. Giảm tốc độ máy.

          2. Giảm độ phân giải hình ảnh.

          3. Giảm độ phân giải màu hiệu ứng nếu cần.

          4. Reset lỗi.

          5. Khi hết lỗi, có thể đưa tốc độ về giá trị ban đầu nếu điều kiện cho
          phép.
        E247: |
          ⚠️ E247 – Thông báo lỗi phiên bản file.

          🔧 Hướng xử lý:
          1. Kiểm tra phiên bản file lệnh/cấu hình.
          2. Kiểm tra file được sử dụng cho các chuyển động phức tạp của máy.
          3. Tải file phiên bản phù hợp với máy.
        E249: |
          ⚠️ E249 – Thiếu bảng âm/dữ liệu trong waveform.

          🔧 Hướng xử lý:
          1. Kiểm tra waveform.
          2. Waveform đang thiếu dữ liệu cần thiết.
          3. Thay thế waveform phù hợp.
          4. Tải lại waveform và kiểm tra.
        E250: |
          ⚠️ E250 – Backup Active: Lỗi truyền thông.

          🔧 Hướng xử lý:
          1. Reset Alarm.
          2. Nếu không hết, tắt nguồn và khởi động lại theo quy trình.
          3. Kiểm tra/thay thế bộ CU1128 theo quy trình kỹ thuật.
          4. Kiểm tra/thay thế bộ điều khiển động cơ Secvor nếu lỗi.
          4. Nếu vẫn lỗi, liên hệ KTV.
        E266: >
          ⚠️ E266 – Lỗi theo dõi phôi.


          🔧 Hướng xử lý:

          1. Kiểm tra cảm biến raster có bị quá tải không.

          2. Kiểm tra phôi có quá lớn hoặc có vật lạ giữa cảm biến và bộ thu
          không.

          3. Làm sạch khu vực làm việc của cảm biến quang điện.

          4. Kiểm tra lỗi chuyển động tự động và các cảnh báo làm gián đoạn hiệu
          chỉnh.

          5. Vệ sinh bề mặt nhạy cảm bằng khí sạch và/hoặc khăn sạch có cồn theo
          quy trình.
        E267: |
          ⚠️ E267 – FireTrigger phát hiện lỗi.

          🔧 Hướng xử lý:
          1. Kiểm tra cáp của FireTrigger.
          2. Kiểm tra kết nối FireTrigger card FirePulse.
          3. Kiểm tra tín hiệu kích hoạt lửa ở trạng thái Auto.
          4. Reset Alarm.
          5. Nếu vẫn lỗi, liên hệ KTV.
        E272: >
          ⚠️ E272 – Cảnh báo EpsiWago.


          🔧 Hướng xử lý:

          1. Kiểm tra module Epsitron Wago có giao tiếp chính xác không.

          2. Kiểm tra đầu nối module Wago.

          3. Nếu lỗi liên quan quá tải/ngắn mạch: kiểm tra mạch phía sau công
          tắc và vòng lặp.

          4. Kiểm tra các kênh bị lỗi.

          5. Nếu vẫn lỗi, liên hệ KTV.
        E273: |
          ⚠️ E273 – Detection Error Fire Trigger.

          🔧 Hướng xử lý:
          1. Kiểm tra jack Trigger card FirePulse.
          2. Kiểm tra cáp FireTrigger.
          3. Reset Alarm.
          4. Nếu không hết, khởi động lại máy.
          5. Nếu vẫn lỗi, liên hệ KTV.
        E336: |
          ⚠️ E336 – Lỗi chồng gạch, lỗi động cơ băng tải.

          🔧 Hướng xử lý:
          1. Nâng đầu in, thoát gạch theo đúng quy trình.
          2. Hoắc nâng đầu in, Bật công tắc Chạy Bypass cho gạch chạy ra hết.
          3. Reset Alarm.
          4. Nếu hết lỗi, chạy máy bình thường.
          5. Nếu vẫn lỗi liên hệ KTV
        E404: |
          ⚠️ E404 – Không khởi động được hệ thống PLC.

          🔧 Hướng xử lý:
          1. Tắt nguồn và khởi động lại.
          2. Kiểm tra PLC và các module liên quan.
          3. Nếu không hết, liên hệ KTV.
        E439: |
          ⚠️ E439 – Ethernet Communication Fail.

          🔧 Hướng xử lý:
          1. Kiểm tra kết nối Ethernet.
          2. Kiểm tra dây mạng và đầu nối.
          3. Tắt nguồn và khởi động lại theo quy trình.
          4. Nếu không hết, liên hệ KTV.
        E441: |
          ⚠️ E441 – Machine General Activation.

          🔧 Hướng xử lý:
          1. Nhấn nút START.
          2. Nếu không được, tắt máy và khởi động lại.
          3. Nếu vẫn không được, liên hệ KTV.
        E442: |
          ⚠️ E442 – Chưa nhấn nút START máy in.

          🔧 Hướng xử lý:
          1. Kiểm tra đèn nút START.
          2. Nhấn nút START.
          3. Kiểm tra đèn xanh báo OK.
          4. Nếu không được, liên hệ KTV.
        F4034: |
          ⚠️ F4034 – Mắc gạch Barrier.

          🔧 Hướng xử lý:
          1. Bấm Xử lý mắc gạch.
          2. Kiểm tra cảm biến độ dày Barrier IG.
          3. Vệ sinh cảm biến nếu bẩn.
          4. Không làm tắt quá trình thoát gạch bị mắc.
          5. Nếu vẫn lỗi, liên hệ KTV.
        W01: |
          ⚠️ W01 – Gạch vào quá dày.

          🔧 Hướng xử lý:
          Khoảng cách giữa 2 viên gạch trên 3 cm.
        W11: |
          ⚠️ W11 – Đầu ra dây chuyền dừng.

          🔧 Hướng xử lý:
          1. Kiểm tra tín hiệu đầu ra dây chuyền.
          2. Kiểm tra phía dây chuyền.
          3. Kiểm tra phía máy in.
          4. Liên hệ KTV nếu cần.
        W17: |
          ⚠️ W17 – Cảnh báo thay lọc/hết mực Bar X.

          🔧 Hướng xử lý:
          1. Kiểm tra bình mực dưới và bổ sung mực.
          2. Kiểm tra thời gian thay lọc.
          3. KTV thay lọc khi bảo dưỡng.
        W33: |
          ⚠️ W33 – Lỗi hệ thống bơm/áp suất ( mất áp hệ thống bơm in head)

          🔧 Hướng xử lý:
          1. Vào MPC kiểm thông số inhead trên hệ thống màn hình.
          2. Thay thế bơm Gotec
          3. THay thế bơm Iwaki ( trong bar màu nếu có)
          4. Nếu thay thế 2 bơm trên mà không hết lỗi. Kiêm tra hở
          ở tất cả các đầu in / kênh màu. Thay thế những đầu in hở
          gây mất áp. 
          5. Nếu vẫn không được, liên hệ KTV.
          
        W39: |
          ⚠️ W39 – Inverter Fault: Biến tần máy hút báo lỗi.

          🔧 Hướng xử lý:
          1. Kiểm tra động cơ máy hút ( có thể do kẹt cánh, hỏng bi, cháy motor)
          2. Kiểm tra biến tần ( có thể hỏng biến tần cần thay thế)
          3. Kiểm tra dây và nguồn cấp.
          4. Thay thế theo quy trình kỹ thuật nếu cần.
          
        W40: |
          ⚠️ W40 – Sapphire Board Error.

          🔧 Hướng xử lý:
          Reset Alarm.
        W44: |
          ⚠️ W44 – Quá nhiệt gạch.

          🔧 Hướng xử lý:
          Reset Alarm.
        W45: |
          ⚠️ W45 – Chưa hạ đầu in.

          🔧 Hướng xử lý:
          Nhấn hạ đầu in xuống vị trí in.
        W61: |
          ⚠️ W61 – Quá nhiệt gạch.

          🔧 Hướng xử lý:
          Reset Alarm.
        W72: |
          ⚠️ W72 – Thiếu đầu vào gạch.

          🔧 Hướng xử lý:
          1. Kiểm tra cảm biến phát hiện gạch đầu vào.
          2. Kiểm tra tín hiệu cảm biến.
          3. Kiểm tra gạch có đi vào đúng vị trí không.
        W73: |
          ⚠️ W73 – Thiếu mã hóa gạch.

          🔧 Hướng xử lý:
          1. Kiểm tra tín hiệu mã hóa gạch.
          2. Kiểm tra cảm biến/encoder liên quan.
          3. Kiểm tra kết nối bộ mã hóa.
        W74: |
          ⚠️ W74 – Mã hóa nhận được từ bộ đồng bộ hóa không hợp lệ.

          🔧 Hướng xử lý:
          1. Kiểm tra bộ đồng bộ hóa.
          2. Kiểm tra tín hiệu encoder.
          3. Kiểm tra cấu hình đồng bộ.
        W75: |
          ⚠️ W75 – Ethernet quá chậm.

          🔧 Hướng xử lý:
          1. Kiểm tra tốc độ và tình trạng mạng Ethernet.
          2. Kiểm tra dây LAN và switch.
          3. Kiểm tra tải mạng.
          4. Nếu vẫn lỗi, liên hệ KTV.
        W77: >
          ⚠️ W77 – Cảnh báo quá giờ vệ sinh tự động

          🔧 Hướng xử lý:
          1. Kiểm tra toàn bộ thời gian các kênh màu
          2. Thời gian cài đặt giữ các kênh màu phải khớp.
          3. Kiểm tra trường hợp thể tích giọt bằng 1s.
          4. Thời gian cài đặt nếu máy máy dừng sản xuất 2h/lần
          5. Thời gian cài đặt sản xuất khoảng 3h/lần vệ sinh tùy điều kiện sản xuất.
          
        W78: >
          ⚠️ W78 – Nhiệt độ FirePulse quá cao.

          🔧 Hướng xử lý:

          1. Kiểm tra quạt làm mát FirePulse.

          2. Với phần cứng phiên bản 1, kiểm tra quạt có hoạt động liên tục
          không.

          3. Với phần cứng phiên bản 2, kiểm tra quạt có chạy khi cần không.

          4. Kiểm tra nhiệt độ FirePulse.

          5. Điều chỉnh bộ điều chỉnh xung về nhiệt độ thấp hơn nếu phù hợp.
        W79: |
          ⚠️ W79 – Bộ đồng bộ hóa không tìm thấy khuôn mặt được kích hoạt.

          🔧 Hướng xử lý:
          1. Kiểm tra cảm biến đồng bộ.
          2. Kiểm tra tín hiệu phát hiện gạch.
          3. Kiểm tra cấu hình bộ đồng bộ hóa.
        W80: |
          ⚠️ W80 – Phiên bản phần cứng DSP khác nhau.

          🔧 Hướng xử lý:
          1. Kiểm tra phiên bản phần cứng DSP.
          2. Kiểm tra các DSP có cùng cấu hình/phiên bản yêu cầu không.
          3. Nếu sai phiên bản, liên hệ KTV.
        W82: |
          ⚠️ W82 – Không có xung Tickle trong waveform, không thể bật Tickle.

          🔧 Hướng xử lý:
          1. Kiểm tra waveform.
          2. Tải lại waveform có xung Tickle phù hợp.
          3. Kiểm tra cấu hình Tickle.
        W83: |
          ⚠️ W83 – Cảnh báo HeadFiring trong thời gian chạy.

          🔧 Hướng xử lý:
          1. Kiểm tra trạng thái HeadFiring.
          2. Kiểm tra tất cả hộp mực có đang tắt không.
          3. Kiểm tra có đủ không gian cần thiết để chạy HeadFiring không.
          4. Kiểm tra khí nén nếu có cảnh báo liên quan.
        W84: |
          ⚠️ W84 – Có vấn đề trong quá trình kiểm tra tính nhất quán.

          🔧 Hướng xử lý:
          1. Chỉ báo động khi bật nhớt kế.
          2. Kiểm tra trạng thái nhớt kế.
          3. Kiểm tra cảm biến và hệ thống đo độ nhớt.
        W85: |
          ⚠️ W85 – Độ nhớt mực quá thấp.

          🔧 Hướng xử lý:
          1. Chỉ báo động khi bật nhớt kế.
          2. Kiểm tra giá trị độ nhớt.
          3. Kiểm tra hệ thống đo và điều chỉnh độ nhớt.
        W86: |
          ⚠️ W86 – Độ nhớt mực quá thấp.

          🔧 Hướng xử lý:
          1. Chỉ báo động khi bật nhớt kế.
          2. Kiểm tra giá trị độ nhớt.
          3. Kiểm tra hệ thống đo và điều chỉnh độ nhớt.
        W87: |
          ⚠️ W87 – RAM dùng để xem trước đã đầy.

          🔧 Hướng xử lý:
          1. Kiểm tra bộ nhớ RAM.
          2. Giải phóng bộ nhớ nếu có thể.
          3. Liên hệ System/KTV nếu vẫn lỗi.
        W88: >
          ⚠️ W88 – Dao động áp suất tấm lưỡi liềm vượt ngưỡng khi bơm chân không
          điều chỉnh bằng PID.


          🔧 Hướng xử lý:

          1. Kiểm tra độ rung/dao động áp suất.

          2. Kiểm tra động lực học mạch thủy lực.

          3. Thử làm trống/xả phù hợp để khôi phục áp suất âm.

          4. Nếu vẫn lỗi, liên hệ KTV.
        W89: >
          ⚠️ W89 – Áp suất tấm lưỡi liềm dưới ngưỡng tối thiểu khi bơm chân
          không điều chỉnh công suất cố định.


          🔧 Hướng xử lý:

          1. Kiểm tra áp suất tối thiểu yêu cầu.

          2. Kiểm tra động lực học mạch thủy lực.

          3. Thử làm trống/xả phù hợp để khôi phục áp suất âm.

          4. Nếu vẫn lỗi, liên hệ KTV.
        W90: |
          ⚠️ W90 – Máy chủ FTP trên DSP không hoàn thành thao tác yêu cầu.

          🔧 Hướng xử lý:
          1. Nếu thao tác là chuyển file, kiểm tra file có tồn tại không.
          2. Xem chi tiết cảnh báo để xác định nguyên nhân.
          3. Kiểm tra kết nối DSP và FTP.
        W95: |
          ⚠️ W95 – Báo nhiệt thanh màu.

          🔧 Hướng xử lý:
          1. Colour Bar → Bar X → Temperature → Zone.
          2. Nếu có đầu báo đỏ, điều chỉnh ±1°C.
          3. Theo dõi lại nhiệt độ sau khi điều chỉnh.
        W96: |
          ⚠️ W96 – Sản xuất đã kết thúc.

          🔧 Hướng xử lý:
          1. Máy đã hoàn thành quá trình sản xuất.
          2. Máy chuyển về chế độ thủ công.
          3. Chuyển lại Auto nếu muốn tiếp tục sản xuất.
          4. Khởi động lại sản xuất theo quy trình.
        W97: >
          ⚠️ W97 – Điều chỉnh nhiệt độ Sapphire / báo nhiệt thanh màu.


          🔧 Hướng xử lý:

          1. Xem chi tiết cảnh báo hiển thị trên giao diện.

          2. Nếu liên quan nhiệt thanh màu: Colour Bar → Bar X → Temperature →
          Zone.

          3. Nếu có đầu báo đỏ, điều chỉnh ±1°C.

          4. Theo dõi lại nhiệt độ sau khi điều chỉnh.
        W101: |
          ⚠️ W101 – Lỗi kẹt máng vệ sinh băng tải.

          🔧 Hướng xử lý:
          1. Kiểm tra mất nước.
          2. Kiểm tra kẹt van.
          3. Kiểm tra kẹt pittong.
          4. Kiểm tra cảm biến máng vệ sinh có sáng không.
          5. Nếu vẫn lỗi, liên hệ KTV.
        W102: |
          ⚠️ W102 – Không phải tất cả các kết nối được kích hoạt.

          🔧 Hướng xử lý:
          1. Kiểm tra trạng thái các kết nối.
          2. Cho phép/kích hoạt tất cả các kết nối cần thiết.
          3. Kiểm tra lại trạng thái máy.
        W103: |
          ⚠️ W103 – Gửi yêu cầu ủy quyền mới cho System.

          🔧 Hướng xử lý:
          Liên hệ System để xử lý yêu cầu ủy quyền.
        W104: >
          ⚠️ W104 – Cấu hình cảm biến vắt không chính xác.


          🔧 Hướng xử lý:

          1. Kiểm tra cảm biến phát hiện vị trí lưỡi gạt.

          2. Kiểm tra trạng thái cảm biến khi lưỡi gạt mở/đóng.

          3. Kiểm tra trạng thái cảm biến có phù hợp với đầu ra điều khiển
          không.

          4. Điều chỉnh lại cảm biến nếu cần.
        W105: |
          ⚠️ W105 – Số lượng tham số tỷ lệ in nhỏ hơn 1.

          🔧 Hướng xử lý:
          Tăng lượng mực đặt lên giá trị phù hợp.
        W106: |
          ⚠️ W106 – Lượng phủ hình ảnh quá lớn so với lượng mực yêu cầu.

          🔧 Hướng xử lý:
          1. Giảm tải lượng phủ.
          2. Thay đổi hình ảnh nếu cần.
          3. Có thể điều chỉnh tốc độ phù hợp.
        W107: |
          ⚠️ W107 – Thiếu dữ liệu năng suất.

          🔧 Hướng xử lý:
          1. Kiểm tra waveform.
          2. Thay đổi waveform phù hợp.
          3. Kiểm tra lại dữ liệu năng suất.
        W108: >
          ⚠️ W108 – Có quá nhiều sự chồng lấp trong in ngẫu nhiên.


          🔧 Hướng xử lý:

          1. Kiểm tra chế độ in "ngẫu nhiên".

          2. Kiểm tra tỷ lệ phần trăm chồng lấp tối đa cho phép.

          3. Điều chỉnh kích thước hình ảnh/phôi nếu cần.

          4. Có thể sử dụng chế độ công việc mới với chế độ in "ngẫu nhiên" để
          giảm khả năng các phần quá giống nhau.
        W120: >
          ⚠️ W120 – Cảnh báo Epsitron/Wpsitron Wago.


          🔧 Hướng xử lý:

          1. Kiểm tra trạng thái module Wago.

          2. Kiểm tra kết nối module.

          3. Chờ thời gian điều chỉnh đặt trước.

          4. Nếu cảnh báo vẫn tồn tại sau thời gian chờ, kiểm tra module và các
          kênh liên quan.

          5. Nếu vẫn lỗi, liên hệ KTV.
  - variables:
      error_message: >
        {% set ns = namespace(result='') %} {% for code, text in
        error_db.items() %}
          {% if not ns.result and msg is search('(^|[^A-Z0-9])' ~ code ~ '([^A-Z0-9]|$)') %}
            {% set ns.result = text %}
          {% endif %}
        {% endfor %} {{ ns.result | trim }}
  - variables:
      instruction_message: >
        {% if 'BỎ IN' in msg or 'KHÔNG IN' in msg %}

        ⚠️ Bỏ in – Cảm Biến Keyence LR-ZB100


        🔧 Hướng xử lý:

        1. Kiểm tra lại cảm biến in IG LR-ZB100.
           Nhấn nút Up-Down để tăng giảm mắt in xem có được không.
           Lưu ý: Đưa gạch vào vị trí in (chỉnh UP - DOWN), cảm biến báo đèn vàng là OK.
        2. Khôi phục cài đặt gốc:
           - Giữ nút Down và nhấn nút Up 5 lần.
           - → rSt → nhấn Up → no → nhấn Up → yes → nhấn Up.
           - Hạ đầu in xuống vị trí in.
           - Đưa gạch vào mắt in.
           - Chỉnh Up hoặc Down.
           - Cảm biến báo đèn vàng là OK.
        3. Nếu khôi phục cài đặt gốc không được, thay cảm biến mới.

        4. Nếu hết lỗi, chạy máy in bình thường.

        {% elif 'SÓNG MÀU' in msg or 'BĂM MÀU' in msg or 'Ô BÀN CỜ' in msg %}

        ⚠️ Hệ thống chuyển động băng tải và hệ thống bơm màu máy in


        🔧 Hướng xử lý:

        1. Kiểm tra gối bi băng tải, dựa vào bản in offset Centerring.
           - Nếu chỉ bị 1 kênh màu: kiểm tra lại hệ thống bơm Inhead và vaccum.
           - Nếu bị tất cả các kênh màu: kiểm tra lại chuyển động băng tải.
        2. Tháo kiểm tra gối bi trục chủ động, trục bị động (nếu bị đảo thì thay
        thế).

        3. Tháo dùng thước kẹp kiểm tra đường kính trục chủ động, trục bị động
        (nếu mòn thì thay thế).

        4. Sau khi thay gối bi và trục lô mà vẫn bị, kiểm tra lại băng tải.

        5. Hiệu chỉnh và theo dõi băng tải. Liên hệ KTV nếu không hết.

        {% elif 'RESET MÀN HÌNH' in msg or 'KHỞI ĐỘNG LẠI MÀN HÌNH' in msg or
        'MÀN HÌNH' in msg or 'SỬA LỖI E120' in msg %}

        ⚠️ Khởi động lại Màn hình máy in System

        🔧 Hướng xử lý:
          
        1. Cách 1: Cài lại thời gian màn hình. Chọn thời gian => Chỉnh thông số
        bất kỳ
          giờ hoặc phút của màn hình => chọn Apply => Ok ( màn hình sẽ tự khởi động lại 2')
        2. Cách 2: Rút jack nguồn 24V cấp cho màn hình ra rồi cắm lại.
          Lưu ý: Với loại màn hình Vuông đời cũ không cần rút jack, Có công tắc cấp nguồn
          dưới đít, tắt công tắc đi và bật lại là được.
        3. Cách 3: Tắt nguồn cấp tổng máy in, khởi động lại toàn bộ
        máy.           
                    
          
          
        {% elif 'KHÔI PHỤC CÀI ĐẶT GỐC BARRIER' in msg or 'CALIB BARRIER' in msg
        or 'THAY BARRIER' in msg or 'SỬA LỖI E120' in msg %}

        ⚠️ Bộ Giải Mã – KEYENCE LV-N11M

        🔧 Hướng xử lý:
        1. Kiểm tra căn chỉnh sensor thu phát sao cho 2 cảm biến song song và
        nhìn đối diện nhau.( chỉnh sao cho giá trị đỏ lớn nhất)
        2. Giữ đồng thời 2 nút SET + PRESET → nhấn mũi tên sang ngang → rSt →
        Mode → nhấn mũi tên sang ngang → init → Mode → OK.
        3. Nếu căn chỉnh và khôi phục không được, thay thiết bị mới. Liên hệ
        KTV.

        {% elif 'HƯỚNG DẪN THAY DSP' in msg or 'THAY CARD DSP' in msg or 'THAY
        DSP' in msg %}

        ⚠️ Hướng dẫn thay DSP.


        🔧 Hướng xử lý:

        1. Tắt nguồn máy in.

        2. Kiểm tra vị trí card (lấy lục giác 4 tháo 2 vít đế).

        3. Lắp card mới. Chỉnh địa chỉ card mới giống card cũ.


        Địa chỉ máy SYSTEM E:

        * BAR 1: DSP - SW256: 0 - SW16: 1 - SW1: 0

        * BAR 2: DSP - SW256: 0 - SW16: 1 - SW1: 1

        * BAR 3: DSP - SW256: 0 - SW16: 1 - SW1: 2

        * BAR 4: DSP - SW256: 0 - SW16: 1 - SW1: 3

        * BAR 5: DSP - SW256: 0 - SW16: 1 - SW1: 4

        * BAR 6: DSP - SW256: 0 - SW16: 1 - SW1: 5

        * BAR 7: DSP - SW256: 0 - SW16: 1 - SW1: 6

        * BAR 8: DSP - SW256: 0 - SW16: 1 - SW1: 7


        4. Cấp nguồn máy in, chạy thử xem có vấn đề gì không.

        5. Nếu thay card không được, liên hệ KTV.

        {% elif 'THAY CARD' in msg or 'THAY FP' in msg or 'THAY CARD FIRE PULSE'
        in msg %}

        ⚠️ Hướng dẫn thay Card FP.


        🔧 Hướng xử lý:

        1. Tắt nguồn máy in.

        2. Kiểm tra vị trí card (lấy lục giác 4 tháo 2 vít đế).

        3. Lắp card mới. Chỉnh địa chỉ card mới giống card cũ.


        Địa chỉ máy SYSTEM E:

        * BAR 1: FP1 - SW1: E - SW2: 1 | FP2 - SW1: F - SW2: 1

        * BAR 2: FP1 - SW1: 2 - SW2: 2 | FP2 - SW1: 3 - SW2: 2

        * BAR 3: FP1 - SW1: 6 - SW2: 2 | FP2 - SW1: 7 - SW2: 2

        * BAR 4: FP1 - SW1: A - SW2: 2 | FP2 - SW1: B - SW2: 2

        * BAR 5: FP1 - SW1: E - SW2: 2 | FP2 - SW1: F - SW2: 2

        * BAR 6: FP1 - SW1: 2 - SW2: 3 | FP2 - SW1: 3 - SW2: 3

        * BAR 7: FP1 - SW1: 6 - SW2: 3 | FP2 - SW1: 7 - SW2: 3

        * BAR 8: FP1 - SW1: A - SW2: 3 | FP2 - SW1: B - SW2: 3


        4. Cấp nguồn máy in, chạy thử xem có vấn đề gì không.

        5. Nếu thay card không được, liên hệ KTV.


        {% elif 'THAY BIẾN TẦN' in msg or 'CÀI ĐẶT BIẾN TẦN' in msg or 'CÀI BIẾN
        TẦN' in msg %}

        ⚠️ Hướng dẫn cài đặt biến tần Yakawa V1000.
          Nhấn mũi tên =>> Xuống =>> Xuống =>> Par ( Parameter) =>> Chọn Enter
          Trang 1: A1-01 => Enter => Enter 
          A1 nhấp nháy. Nếu chọn mũi tên lên hoặc xuống sẽ chuyển sang B1, C1...vv=> Enter là chọn
          Nếu 01 nhấp nháy bấm mũi lên lên hoặc xuống để thay đổi giá trị). rồi => Enter 
          ( để vào cài đặt giá trị) =>> Chọn giá trị = X => Enter cài đặt thành công.
          Nhấn ESC để thoát ra ngoài.

        🔧 Hướng dẫn cài đặt:

        1. A1-03 = 2220

        2. B1-01 = 0

        3. B1-04 = 1

        4. C1-01 = 2

        5. C1-02 = 5

        6. D1-01 = 40

        7. D1-02 = 60

        8. E1-04 = 60

        9. E2-01 = 9

        10. E2-04 = 2

        11. O2-09 = 2

        12. L6-01 = 3

        13. L6-02 = 110

        14. L6-03 = 1

        {% endif %}
  - variables:
      reply: >
        {% if error_message | trim != '' %}{{ error_message | trim }} {% else
        %}{{ instruction_message | trim }}{% endif %}
  - action: rest_command.print_learn_lookup
    data:
      code: '{{ request_code }}'
      group_id: '{{ reply_thread_id }}'
    response_variable: learn_lookup
    continue_on_error: true
  - variables:
      learned_message: >-
        {% if learn_lookup is defined and learn_lookup.status == 200 and
        learn_lookup.content is mapping %}{{ learn_lookup.content.text |
        default('', true) | trim }}{% endif %}
  - if:
      - condition: template
        value_template: '{{ wants_history and not is_log_query and not is_log_edit }}'
    then:
      - action: rest_command.print_log_query
        data:
          q: ''
          group_id: '{{ reply_thread_id }}'
        response_variable: log_ctx
        continue_on_error: true
      - variables:
          ai_ctx: >-
            {% if log_ctx is defined and log_ctx.status == 200 and
            log_ctx.content is mapping and log_ctx.content['items'] %}


            [DỮ LIỆU THẬT từ sổ NHẬT KÝ SỬA CHỮA / THAY THẾ THIẾT BỊ trên
            server (mới nhất trước; "dây chuyền 4" chính là DC4): {% for it in
            log_ctx.content['items'] %}
            - {{ it.date }}: {{ it.device }}{% if it.position %} | {{
            it.position }}{% endif %}{% if it.machine %} | {{ it.machine }}{%
            endif %}{% if it.note %} | {{ it.note }}{% endif %}{% endfor %} Hãy
            trả lời câu hỏi phía trên CHỈ dựa vào dữ liệu này; hạng mục nào
            không có trong dữ liệu thì nói rõ "chưa có ghi nhận", tuyệt đối
            không bịa thêm.] {% endif %}
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ is_image }}'
        sequence:
          - variables:
              ai_cands: >-
                {% set live = states.ai_task |
                rejectattr('state', 'eq', 'unavailable') |
                map(attribute='entity_id') | list %}{% set pref =
                ['ai_task.google_ai_task'] if 'ai_task.google_ai_task' in
                live else [] %}{{ (pref + live) | unique | list }}
              ai_dump: >-
                {% for e in states.ai_task %}{{ e.entity_id }}={{
                e.state }}; {% endfor %}
              img_text: ''
          - variables:
              cand0: "{{ ai_cands[0] if ai_cands | length > 0 else '' }}"
              cand1: "{{ ai_cands[1] if ai_cands | length > 1 else '' }}"
              cand2: "{{ ai_cands[2] if ai_cands | length > 2 else '' }}"
          - if:
              - condition: template
                value_template: "{{ cand0 != '' }}"
            then:
              - action: downloader.download_file
                data:
                  url: '{{ image_url }}'
                  subdir: zalo_images
                  filename: image_latest.jpg
                  overwrite: true
                continue_on_error: true
              - delay: '00:00:03'
              - if:
                - condition: template
                  value_template: "{{ cand0 != '' }}"
                then:
                  - action: ai_task.generate_data
                    data:
                      task_name: Phân tích ảnh Zalo
                      entity_id: '{{ cand0 }}'
