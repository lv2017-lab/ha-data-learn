          2. Kiểm tra module PLC.
          3. Nếu không hết, liên hệ KTV.
        E116: |
          ⚠️ E116 – Card FirePulse: Lỗi cấp nguồn 24V.

          🔧 Hướng xử lý:
          1. Kiểm tra nguồn 24V.
          2. Kiểm tra bảo vệ nhiệt.
          3. Kiểm tra dây và đầu nối nguồn card FirePulse.
          4. Nếu vẫn lỗi, liên hệ KTV.
        E117: |
          ⚠️ E117 – Card FirePulse: Lỗi cấp nguồn 230V.

          🔧 Hướng xử lý:
          1. Kiểm tra nguồn 230V.
          2. Kiểm tra bảo vệ nhiệt.
          3. Kiểm tra dây và đầu nối nguồn card FirePulse.
          4. Chỉ thao tác điện khi đã cô lập nguồn và đảm bảo an toàn.
        E118: |
          ⚠️ E118 – Kiểm tra nhiệt độ tủ điều khiển.

          🔧 Hướng xử lý:
          1. Kiểm tra nhiệt độ trong tủ điều khiển.
          2. Kiểm tra quạt và điều hòa tủ.
          3. Kiểm tra cảm biến nhiệt độ.
        E119: |
          ⚠️ E119 – Lỗi điều chỉnh xung / điều hòa tủ FirePulse.

          🔧 Hướng xử lý:
          1. Kiểm tra điều hòa cánh tủ điện.
          2. Kiểm tra nhiệt độ tủ FirePulse.
          3. Máy thường khoảng 28°C ngắt và 32°C đóng Block.
          4. Dùng biện pháp làm mát tạm thời an toàn nếu cần.
          5. Làm phiếu yêu cầu sửa điều hòa.
          6. Liên hệ KTV nếu không hết.
        E120: >
          ⚠️ E120 – Lỗi cảm biến Barrier Hoặc báo chồng gạch


          🔧 Hướng xử lý:

          1. Kiểm tra chồng gạch đầu vào máy in, nếu có xử lý chồng gạch theo
          đúng quy trình 

          2. Nếu không có gạch vẫn báo E120. Kiểm tra căn chỉnh sensor thu phát
          sao cho hai cảm biến song song và đối diện nhau.

          3. Giá trị báo trên bộ giải mã cần đạt vùng màu xanh cao nhất. ( Cảm
          biến thu báo 2 đèn tín hiệu Powe + Aligimen)

          3. Nếu màn hình hiển thị báo giá trị Error. Hướng dẫn Khôi phục cài
          đặt gốc bộ đọc Barrier  Giữ đồng thời SET + PRESET => Nhấn mũi tên
          sang ngang → rSt → Mode => Nhấn mũi tên sang ngang → init → Mode → OK.

          6. Nếu căn chỉnh và khôi phục không được, thay thiết bị mới và liên hệ
          KTV.
