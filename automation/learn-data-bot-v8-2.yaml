          2. Kiểm tra tham số hiện tại có gây điện áp thấp không.
          3. Kiểm tra kênh có được bật và có nguồn hay không.
          4. Kiểm tra file waveform có tồn tại trên máy không.
          5. Điều chỉnh tham số/waveform theo cấu hình kỹ thuật.
          
