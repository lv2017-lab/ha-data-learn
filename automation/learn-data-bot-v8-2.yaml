                            Kết quả phân tích ảnh, tiếng Việt có đầy đủ dấu,
                            giọng nhẹ nhàng ngọt ngào, xưng em. Chỉ gồm những
                            gì thực sự xuất hiện và nhìn thấy rõ trong ảnh:
                            người, động vật, phương tiện nếu có mặt thì mô tả
                            chi tiết số lượng, trang phục, hành động; chữ, số
                            và mã lỗi đọc được trên màn hình hoặc thiết bị.
