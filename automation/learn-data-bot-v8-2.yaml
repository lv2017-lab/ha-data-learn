          🔧 Hướng xử lý:
          1. Kiểm tra mạng CAN.
          2. Kiểm tra card/module ADS.
          3. Nếu vẫn lỗi, liên hệ KTV.
          
        E109: >
          ⚠️ E109 – Lỗi hệ thống bơm Vaccum Pump ( Bơm chân không)

          🔧 Hướng xử lý:

          1. Thay thế loại trừ bơm chân không.
          2. Nếu thay bơm vẫn không được. kiểm tra lại đường ống bơm chân không
          từ trên Bar Reservoi xuống Cụm van bơm chân không. ( Thay thế đường ông
          nếu cần loại trừ)
          3. Nếu đường ống Ok mà ko được. Kiêm tra lại cụm van xả mực ở cạnh bơm 
          xem có bị lỗi không. ( Thay thế Van nếu hỏng).
          4. Xử lý các bước trên mà vẫn không được. Kiểm tra lại tín hiệu điều khiển
          bơm Vaccum ( Kiểm tra tín hiệu điều khiển từ Module PLC xuống). Thay thế
          nếu Module PLC điều khiển hỏng.
          5. Nếu không được, liên hệ KTV.
          
