          1. Kiểm tra hệ thống dây và thiết bị an toàn.
          2. Kiểm tra giao tiếp của hệ thống Safety.
          3. Không bypass mạch an toàn khi chưa có quy trình được phê duyệt.
        E106: |
          ⚠️ E106 – Hộp mực 1: Lỗi kiểm soát áp suất tấm lưỡi liềm.

          🔧 Hướng xử lý:
          1. Kiểm tra áp suất.
          2. Kiểm tra bơm chân không và đường ống.
          3. Kiểm tra cảm biến áp suất.
        E107: |
          ⚠️ E107 – Hộp mực 2: Lỗi kiểm soát áp suất tấm lưỡi liềm.

          🔧 Hướng xử lý:
