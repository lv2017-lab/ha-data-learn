alias: Learn Data Bot V8.2
description: >-
  Learn Data Bot - Kho loi may in + AI + Nhat ky sua chua + Phan tich anh (goi ten bot la tra loi)
triggers:
  - trigger: webhook
    webhook_id: -uDqEAQOREUiLyScdTJTYuiJ6
    allowed_methods:
      - POST
      - PUT
      - GET
      - HEAD
    local_only: false
conditions:
  - condition: template
    value_template: >-
      {% set j = trigger.get('json', {}) %} {% set d = j.get('data', {}) %}
      {% set craw = d.get('content', '') %} {% set content = (craw if craw
      is string else '') | trim %} {% set gid = d.get('idTo', '') | string
      | trim %} {% set allowed = ['5983799972549184973', 'GROUP_ID_2',
      'GROUP_ID_3', 'GROUP_ID_4'] %} {% set is_image = craw is mapping and
      (craw.get('href', '') | string).startswith('http') %} {{ gid in
      allowed and j.get('isSelf', true) == false and (content != '' or
      is_image) }}
actions:
  - variables:
      reply_thread_id: >-
        {% set j = trigger.get('json', {}) %} {% set d = j.get('data', {}) %}
        {{ d.get('idTo') | default('', true) | string | trim }}
  - variables:
      bot_name: 'lyly'
      image_enabled: true
  - variables:
      raw_message: >
        {{ trigger.get('json', {}).get('data', {}).get('content', '') | string |
        trim }}
  - variables:
      user_message: >
        {{ raw_message | replace('@Aibot', '') | replace('@aibot', '') |
        replace('@AIBOT', '') | regex_replace('(?i)^@?' ~ bot_name ~
        '[,: ]*', '') | regex_replace('(?i)^ơi[, ]*', '') | trim }}
  - variables:
      msg: '{{ user_message | upper | trim }}'
  - variables:
      has_tag: '{{ ''@aibot'' in (raw_message | lower) }}'
  - variables:
      is_called: >-
        {{ has_tag or (raw_message | lower) is search('(^|[^a-z])' ~
        (bot_name | lower) ~ '([ ,:.!?]|$)') }}
      image_url: >-
        {% set c = trigger.get('json', {}).get('data', {}).get('content',
        '') %}{{ c.get('href', '') if c is mapping else '' }}
      is_image: "{{ image_enabled and (image_url | string | trim) != '' }}"
  - if:
      - condition: template
        value_template: "{{ (raw_message | trim) != '' }}"
    then:
      - action: rest_command.bot_names_get
        data:
          group_id: '{{ reply_thread_id }}'
        response_variable: names_resp
        continue_on_error: true
  - variables:
      dyn_names: >-
        {% if names_resp is defined and names_resp.status == 200 and
        names_resp.content is mapping and names_resp.content.get('names')
        %}{{ names_resp.content.get('names') }}{% else %}{{ ['Lyly', 'Ly
        Ly', 'Ly Ky'] }}{% endif %}
      user_message: >-
        {% set q0 = raw_message | replace('@Aibot', '') |
        replace('@aibot', '') | replace('@AIBOT', '') %} {% set ns =
        namespace(q=q0) %} {% for n in dyn_names %} {% set ns.q = ns.q |
        regex_replace('(?i)^@?' ~ n ~ '[,: ]*', '') %} {% endfor %} {{
        ns.q | regex_replace('(?i)^ơi[, ]*', '') |
        regex_replace('(?i)^ơii[, ]*', '') | trim }}
      msg: '{{ user_message | upper | trim }}'
      is_called: >-
        {% set low = raw_message | lower %} {% set ns = namespace(found =
        has_tag) %} {% for n in dyn_names %} {% if low is
        search('(^|[^a-zà-ỹ])' ~ (n | lower) ~ '([ ,:.!?]|$)') %} {% set
        ns.found = true %} {% endif %} {% endfor %} {{ ns.found }}
      bot_name: "{{ dyn_names[0] if dyn_names else 'lyly' }}"
      is_rename: "{{ is_called and msg.startswith('ĐỔI TÊN') }}"
      rename_names: >-
        {% set t = user_message | regex_replace('(?i)^đổi tên( bot)?\\s*',
        '') | regex_replace('(?is)^.*thành\\s*:?\\s*', '') %} {% set parts
        = t | replace(' hoặc ', ',') | replace(' và ', ',') %} {% set lst =
        parts.split(',') %} {{ lst | map('trim') | reject('eq', '') | list }}
      rename_csv: "{{ rename_names | join(',') }}"
      is_add_name: "{{ is_called and msg.startswith('THÊM TÊN') }}"
      add_name: >-
        {{ user_message | regex_replace('(?i)^thêm tên\\s*:?\\s*', '') | trim }}
      is_del_name: >-
        {{ is_called and (msg.startswith('XÓA TÊN') or
        msg.startswith('BỎ TÊN')) }}
      del_name: >-
        {{ user_message | regex_replace('(?i)^(xóa|bỏ) tên\\s*:?\\s*', '') |
        trim }}
  - if:
      - condition: template
        value_template: "{{ (raw_message | trim) != '' }}"
    then:
      - action: rest_command.memory_epoch_get
        data:
          group_id: '{{ reply_thread_id }}'
        response_variable: mem_resp
        continue_on_error: true
  - variables:
      mem_epoch: >-
        {% if mem_resp is defined and mem_resp.status == 200 and
        mem_resp.content is mapping %}{{ mem_resp.content.get('epoch', 0)
        | int }}{% else %}0{% endif %}
      is_wipe_memory: >-
        {{ is_called and (msg.startswith('XÓA GHI NHỚ') or
        msg.startswith('XÓA TRÍ NHỚ') or msg.startswith('QUÊN HẾT')) }}
  - variables:
      rem_rel: >-
        {% set a = user_message | regex_findall('(?i)sau\\s+(\\d{1,4})\\s*(phút|giờ|tiếng)') %}{% set b = user_message | regex_findall('(?i)(\\d{1,4})\\s*(phút|giờ|tiếng)\\s*(sau|nữa)') %}{% set m = a + b %}{{ m[0] if m else [] }}
      rem_rel_num: "{{ rem_rel[0] | int if rem_rel else 0 }}"
      rem_rel_unit: "{{ rem_rel[1] if rem_rel else '' }}"
      rem_hh: >-
        {% set a = user_message | regex_findall('(?i)(\\d{1,2})\\s*(?:h|giờ)\\s*(\\d{1,2})?') %}{% set b = user_message | regex_findall('(\\d{1,2}):(\\d{2})') %}{% if a %}{{ a[0][0] | int }}{% elif b %}{{ b[0][0] | int }}{% else %}-1{% endif %}
      rem_mm: >-
        {% set a = user_message | regex_findall('(?i)(\\d{1,2})\\s*(?:h|giờ)\\s*(\\d{1,2})?') %}{% set b = user_message | regex_findall('(\\d{1,2}):(\\d{2})') %}{% if a %}{{ (a[0][1] | int) if a[0][1] else 0 }}{% elif b %}{{ b[0][1] | int }}{% else %}0{% endif %}
      rem_has_time: "{{ rem_rel_num > 0 or (rem_hh >= 0 and rem_hh <= 23 and rem_mm <= 59) }}"
      rem_tomorrow: "{{ 'NGÀY MAI' in msg }}"
      rem_date: >-
        {% set dm = msg | regex_findall('(\\d{1,2})/(\\d{1,2})') %}{{ dm[0] if dm else [] }}
      rem_ts: >-
        {% set base = now() %}{% if rem_rel_num > 0 %}{% set t = base + (timedelta(minutes=rem_rel_num) if rem_rel_unit == 'phút' else timedelta(hours=rem_rel_num)) %}{{ as_timestamp(t) | int }}{% else %}{% set hh = rem_hh if 0 <= rem_hh <= 23 else 0 %}{% set mm = rem_mm if 0 <= rem_mm <= 59 else 0 %}{% set t = base.replace(hour=hh, minute=mm, second=0, microsecond=0) %}{% set dd = rem_date[0] | int if rem_date else 0 %}{% set mo = rem_date[1] | int if rem_date else 0 %}{% if 1 <= dd <= 31 and 1 <= mo <= 12 %}{% set t = t.replace(day=1).replace(month=mo) + timedelta(days=dd - 1) %}{% elif rem_tomorrow or t <= base %}{% set t = t + timedelta(days=1) %}{% endif %}{{ as_timestamp(t) | int }}{% endif %}
      rem_when: "{{ rem_ts | timestamp_custom('%H:%M %d/%m/%Y') }}"
      rem_content: >-
        {{ user_message | regex_replace('(?i)sau\\s+\\d{1,4}\\s*(phút|giờ|tiếng)', ' ') | regex_replace('(?i)\\d{1,4}\\s*(phút|giờ|tiếng)\\s*(sau|nữa)', ' ') | regex_replace('(?i)ngày\\s+\\d{1,2}/\\d{1,2}(/\\d{2,4})?', ' ') | regex_replace('\\d{1,2}/\\d{1,2}(/\\d{2,4})?', ' ') | regex_replace('(?i)ngày mai|hôm nay', ' ') | regex_replace('(?i)\\d{1,2}\\s*(h|giờ)\\s*\\d{0,2}\\s*(phút)?', ' ') | regex_replace('\\d{1,2}:\\d{2}', ' ') | regex_replace('(?i)\\blúc\\b', ' ') | regex_replace('(?i)(nhớ\\s+)?nhắc\\s+(tôi|anh|em)\\b', ' ') | regex_replace('(?i)^\\s*nhắc\\s+', ' ') | regex_replace('\\s+', ' ') | regex_replace('^[\\s,;:.]+|[\\s,;:.]+$', '') | trim }}
      is_reminder: "{{ is_called and 'NHẮC' in msg and rem_has_time }}"
      is_reminder_list: "{{ is_called and ('LỊCH HẸN' in msg or 'LỊCH NHẮC' in msg) and not is_reminder }}"
      rem_cancel_id: >-
        {% set c = msg | regex_findall('#(\\d+)') %}{{ c[0] | int if c else 0 }}
      is_reminder_cancel: "{{ is_called and ('HỦY LỊCH' in msg or 'HUỶ LỊCH' in msg or 'XÓA LỊCH' in msg) }}"

  - variables:
      is_learn: >-
        {{ is_called and (msg.startswith('HỌC') or msg.startswith('GHI NHỚ') or
        msg.startswith('GHI NHO') or msg.startswith('SỬA MÃ')) }}
      is_forget: >-
        {{ is_called and (msg.startswith('XÓA HỌC') or msg.startswith('XOA HOC')
        or msg.startswith('QUÊN MÃ')) }}
      request_code: >-
        {% set codes = msg | regex_findall('([A-Z]{1,3}[0-9]{1,4})') %}{{ codes[0]
        if codes else '' }}
      learn_text: >-
        {{ user_message | regex_replace('(?i)^học\\s*:?\\s*[EWF][0-9]{2,4}\\s*[:\\-]\\s*',
        '') | regex_replace('(?i)^ghi nhớ\\s*:?\\s*[EWF][0-9]{2,4}\\s*[:\\-]\\s*',
        '') | regex_replace('(?i)^ghi nho\\s*:?\\s*[EWF][0-9]{2,4}\\s*[:\\-]\\s*',
        '') | trim }}
        {{ user_message | regex_replace('(?i)^học\\s*:\\s*', '') |
        regex_replace('(?i)^ghi nhớ\\s*:\\s*', '') |
        regex_replace('(?i)^ghi nho\\s*:\\s*', '') | trim }}
  - variables:
      learn_stored_text: >-
        {% set t = user_message | regex_replace('(?i)^học\\s*:?\\s*[A-Z]{1,3}[0-9]{1,4}\\s*[:\\-]\\s*',
        '') | regex_replace('(?i)^sửa mã\\s*:?\\s*[A-Z]{1,3}[0-9]{1,4}\\s*[:\\-]\\s*',
        '') | regex_replace('(?i)^ghi nhớ\\s*:?\\s*[A-Z]{1,3}[0-9]{1,4}\\s*[:\\-]\\s*',
        '') | regex_replace('(?i)^ghi nho\\s*:?\\s*[A-Z]{1,3}[0-9]{1,4}\\s*[:\\-]\\s*',
        '') | regex_replace('(?i)^(học|sửa mã|ghi nhớ|ghi nho)\\s*:\\s*',
        '') %} {% set p = t.split(' - ') %} {% set nd = p[0] | trim %}
        {% set hd = p[1:] | join(' - ') | trim %} {% if hd %}{{ '❌ Mã
        lỗi ' ~ request_code ~ ': ' ~ nd ~ '\n🔧 Hướng xử lý: ' ~ hd
        }}{% else %}{{ '❌ Mã lỗi ' ~ request_code ~ ': ' ~ nd }}{%
        endif %}
  - variables:
      is_log: "{{ is_called and msg.startswith('NHẬT KÝ') }}"
      is_log_delete: >-
        {{ is_called and not is_learn and msg.startswith('XÓA NHẬT KÝ') }}
      log_del_date: >-
        {% set dd = msg |
        regex_findall('([0-9]{1,2}/[0-9]{1,2}/[0-9]{4})') %}{{ dd[0] if dd
        else '' }}
      log_del_id: >-
        {% set t = user_message | regex_replace('(?i)^xóa nhật ký\s*:?\s*',
        '') | regex_replace('[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}', '') %} {% set nn
        = t | regex_findall('([0-9]+)') %}{{ nn[0] if nn else '' }}
      is_log_query: >-
        {{ is_called and not is_learn and not is_log and not is_log_delete and
        (msg.startswith('TRA NHẬT KÝ') or msg.startswith('LỊCH SỬ') or msg is
        search('ĐÃ THAY|THAY THẾ NHỮNG|THAY NHỮNG GÌ')) }}
      log_raw: >-
        {{ user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') | trim }}
      log_nparts: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') %}{{ r.split('|') | length }}
      log_query_text: >-
        {{ user_message | regex_replace('(?i)^tra nhật ký\s*:?\s*', '') |
        regex_replace('(?i)^lịch sử\s*:?\s*', '') | trim }}
      log_q: >-
        {{ log_query_text |
        regex_replace('(?i)(đã\s+thay(\s+thế)?|thay\s+thế)(\s+những)?(\s+gì)?',
        '') | regex_replace('\\?', '') | regex_replace('\\s+', ' ') | trim }}
      ai_ctx: ''
      wants_history: >-
        {{ is_called and not is_learn and not is_forget and not is_log_delete and msg is
        search('THAY|LỊCH SỬ|NHẬT KÝ|DÂY CHUYỀN|BẢO TRÌ|SỬA CHỮA|HỎNG') }}
  - variables:
      log_device: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') %}
        {{ r.split('|')[0] | trim }}
      log_p1: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') %}
        {% set p = r.split('|') %}{{ p[1] | trim if p | length > 1
        else '' }}
      log_p2: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') %}
        {% set p = r.split('|') %}{{ p[2] | trim if p | length > 2
        else '' }}
      log_p3: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') %}
        {% set p = r.split('|') %}{{ p[3] | trim if p | length > 3
        else '' }}
      log_p4: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') %}
        {% set p = r.split('|') %}{{ p[4] | trim if p | length > 4
        else '' }}
  - variables:
      log_position: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') %}
        {% set p = r.split('|') %}{{ (p[1] | trim if p | length > 1
        else '') | regex_replace('(?i)DC\s?[1-4]', '') | trim }}
      log_machine: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') %}
        {% set p = r.split('|') %}{% set p2 = p[2] | trim if p |
        length > 2 else '' %}{% set src = (p2 ~ ' ' ~ r) if p | length >= 4
        else r %}{% set mm = src |
        regex_findall('(?i)(?:DC|DÂY CHUYỀN|CHUYỀN)\s?([1-4])') %}{{ 'DC'
        ~ mm[0] if mm else '' }}
      log_note: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') %}
        {% set p = r.split('|') %}{% set p2 = p[2] | trim if p |
        length > 2 else '' %}{% set p3 = p[3] | trim if p | length > 3 else
        '' %}{% if p | length >= 4 %}{{ p3 }}{% elif p | length == 3 %}{{ ''
        if p2 is match('(?i)^DC\\s?[1-4]$') or p2 is
        match('^[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}$') else p2 }}{% endif %}
      log_date_in: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\s*:?\s*', '') %}
        {% set p = r.split('|') %}{% if p | length >= 5 %}{{ p[4] |
        trim }}{% else %}{% set dd = r |
        regex_findall('([0-9]{1,2}/[0-9]{1,2}/[0-9]{4})') %}{{ dd[0] if dd
        else '' }}{% endif %}
  - variables:
      is_log_dash: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\\s*:?\\s*',
        '') %}{{ is_log and (' - ' in r) and ('|' not in r) }}
      d_machine: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\\s*:?\\s*',
        '') %} {% set p = r.split(' - ') %} {% set s0 = p[0] | trim %}
        {% set rest = s0 | regex_replace('(?i)^máy\\s+', '') %} {{ rest
        if rest is match('(?i)^(dc|dây chuyền|[0-9])') else s0 }}
      d_device: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\\s*:?\\s*',
        '') %} {% set p = r.split(' - ') %} {{ (p[1] | trim if p |
        length > 1 else '') | regex_replace('(?i)^thay( thế)?\\s+(thiết
        bị\\s+)?', '') | trim }}
      d_date: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\\s*:?\\s*',
        '') %} {% set p = r.split(' - ') %} {% set cand = p[3] | trim if
        p | length > 3 else '' %} {% set cand2 = p[2] | trim if p |
        length > 2 else '' %} {% if cand is
        match('^[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}$') %}{{ cand }}{% elif
        cand2 is match('^[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}$') %}{{ cand2
        }}{% else %}{{ '' }}{% endif %}
      d_position: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\\s*:?\\s*',
        '') %} {% set p = r.split(' - ') %} {% set cand2 = p[2] | trim
        if p | length > 2 else '' %} {{ '' if cand2 is
        match('^[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}$') else cand2 }}
      d_note: >-
        {% set r = user_message | regex_replace('(?i)^nhật ký\\s*:?\\s*',
        '') %} {% set p = r.split(' - ') %} {% set cand = p[3] | trim if
        p | length > 3 else '' %} {% set head = [cand] if cand and not
        (cand is match('^[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}$')) else [] %}
        {{ (head + p[4:]) | join(' - ') | trim }}
  - variables:
      log_device: "{{ d_device if is_log_dash else log_device }}"
      log_position: "{{ d_position if is_log_dash else log_position }}"
      log_machine: "{{ d_machine if is_log_dash else log_machine }}"
      log_note: "{{ d_note if is_log_dash else log_note }}"
      log_date_in: "{{ d_date if is_log_dash else log_date_in }}"
  - variables:
      is_log_edit: "{{ is_called and msg.startswith('SỬA NHẬT KÝ') }}"
      edit_body: >-
        {{ user_message | regex_replace('(?i)^sửa nhật ký[ ]*:?[ ]*#?[ ]*',
        '') | trim }}
      edit_id: >-
        {% set nn = edit_body | regex_findall('^([0-9]+)') %}{{ nn[0] if nn
        else '' }}
      edit_raw: >-
        {{ edit_body | regex_replace('^[0-9]+[ ]*:?[ ]*', '') | trim }}
      edit_nparts: >-
        {% set r = (user_message | regex_replace('(?i)^sửa nhật ký[ ]*:?[ ]*#?[ ]*', '') | regex_replace('^[0-9]+[ ]*:?[ ]*', '')) %}{{ r.split('|') | length }}
  - variables:
      edit_device: >-
        {% set r = (user_message | regex_replace('(?i)^sửa nhật ký[ ]*:?[ ]*#?[ ]*', '') | regex_replace('^[0-9]+[ ]*:?[ ]*', '')) %}
        {{ r.split('|')[0] | trim }}
      edit_p1: >-
        {% set r = (user_message | regex_replace('(?i)^sửa nhật ký[ ]*:?[ ]*#?[ ]*', '') | regex_replace('^[0-9]+[ ]*:?[ ]*', '')) %}
        {% set p = r.split('|') %}{{ p[1] | trim if p | length > 1
        else '' }}
      edit_p2: >-
        {% set r = (user_message | regex_replace('(?i)^sửa nhật ký[ ]*:?[ ]*#?[ ]*', '') | regex_replace('^[0-9]+[ ]*:?[ ]*', '')) %}
        {% set p = r.split('|') %}{{ p[2] | trim if p | length > 2
        else '' }}
      edit_p3: >-
        {% set r = (user_message | regex_replace('(?i)^sửa nhật ký[ ]*:?[ ]*#?[ ]*', '') | regex_replace('^[0-9]+[ ]*:?[ ]*', '')) %}
        {% set p = r.split('|') %}{{ p[3] | trim if p | length > 3
        else '' }}
      edit_p4: >-
        {% set r = (user_message | regex_replace('(?i)^sửa nhật ký[ ]*:?[ ]*#?[ ]*', '') | regex_replace('^[0-9]+[ ]*:?[ ]*', '')) %}
        {% set p = r.split('|') %}{{ p[4] | trim if p | length > 4
        else '' }}
  - variables:
      edit_position: >-
        {% set r = (user_message | regex_replace('(?i)^sửa nhật ký[ ]*:?[ ]*#?[ ]*', '') | regex_replace('^[0-9]+[ ]*:?[ ]*', '')) %}
        {% set p = r.split('|') %}{{ (p[1] | trim if p | length > 1
        else '') | regex_replace('(?i)DC\s?[1-4]', '') | trim }}
      edit_machine: >-
        {% set r = (user_message | regex_replace('(?i)^sửa nhật ký[ ]*:?[ ]*#?[ ]*', '') | regex_replace('^[0-9]+[ ]*:?[ ]*', '')) %}
        {% set p = r.split('|') %}{% set p2 = p[2] | trim if p |
        length > 2 else '' %}{% set src2 = (p2 ~ ' ' ~ r) if p | length >=
        4 else r %}{% set mm = src2 |
        regex_findall('(?i)(?:DC|DÂY CHUYỀN|CHUYỀN)\s?([1-4])') %}{{ 'DC'
        ~ mm[0] if mm else '' }}
      edit_note: >-
        {% set r = (user_message | regex_replace('(?i)^sửa nhật ký[ ]*:?[ ]*#?[ ]*', '') | regex_replace('^[0-9]+[ ]*:?[ ]*', '')) %}
        {% set p = r.split('|') %}{% set p2 = p[2] | trim if p |
        length > 2 else '' %}{% set p3 = p[3] | trim if p | length > 3 else
        '' %}{% if p | length >= 4 %}{{ p3 }}{% elif p | length == 3 %}{{ ''
        if p2 is match('(?i)^DC\\s?[1-4]$') or p2 is
        match('^[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}$') else p2 }}{% endif %}
      edit_date_in: >-
