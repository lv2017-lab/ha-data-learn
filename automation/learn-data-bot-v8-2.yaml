          4. Add lại mẫu sản xuất nếu cần.
          5. Nếu không được, liên hệ KTV.
        E185: >
          ⚠️ E185 – Tệp cấu hình bị hỏng, các thay đổi mới nhất có thể đã bị
          mất.


          🔧 Hướng xử lý:

          1. Reset card Carrier.

          2. Kiểm tra lại cấu hình máy.

          3. Nếu vẫn lỗi, liên hệ KTV.
        E186: |
          ⚠️ E186 – Lỗi card máy in.

          🔧 Hướng xử lý:
          1. Tắt máy in và khởi động lại.
          2. Máy đời 2015, 2016 Kiểm tra xem có Board Bộ Đếm Scheda Control Rs232 không.
          Nếu có kiểm tra và thay thế board bộ đếm trên. ( Nguyên nhân Board lỗi Giải mã 
          không kịp).
          3. Máy in đời 2017 trở lên ko có baord Rs232. Cập nhật lại PLC => Update Distribution
          => khởi động lại máy in. 
          2. Nếu vẫn lỗi, liên hệ KTV.
        E189: |
          ⚠️ E189 – Lỗi giao tiếp EtherCAT.

          🔧 Hướng xử lý:
          1. Kiểm tra cáp của thiết bị EtherCAT.
          2. Kiểm tra thiết bị có được kết nối hay không.
          3. Kiểm tra thiết bị EtherCAT có lỗi không.
          4. Nếu không được, liên hệ KTV.
        E190: >
          ⚠️ E190 – Lỗi giai đoạn kích hoạt 150V / lỗi card FirePulse.


          🔧 Hướng xử lý:

          1. Kiểm tra nguồn 150V và 12V.

          2. Kiểm tra mạch công suất trên card FirePulse.

          3. Kiểm tra cầu chì có bị đứt/cháy không.

          4. Đây có thể là lỗi cháy/hỏng card FirePulse.

          5. Nếu xác định card hỏng, thay card FirePulse theo quy trình kỹ
          thuật.

          6. ⚠️ Khi thao tác với nguồn điện cao áp phải cô lập nguồn và đảm bảo
          an toàn.
