          2. Kiểm tra lỗi phanh động cơ.
          3. Kiểm tra lỗi truyền thông tới Drive.
          4. Kiểm tra độ lệch theo dõi vị trí.
          5. Kiểm tra Drive.
          6. Kiểm tra dây encoder.
          7. Kiểm tra gạch có vật cản Barrier không.
        E99: |
          ⚠️ E99 – An toàn: Báo động chung.

          🔧 Hướng xử lý:
          1. Kiểm tra toàn bộ mạch an toàn.
          2. Kiểm tra các nút Emergency Stop và thiết bị bảo vệ.
          3. Xử lý nguyên nhân trước khi Reset Alarm.
        E101: |
          ⚠️ E101 – An toàn: Lỗi giao tiếp.

