      error_db:
        E03: |
          ⚠️ E03 – Lỗi tải firmware DSP / DSP không nhận IP / Card DSP hỏng.

          🔧 Hướng xử lý:
          1. ⚠️ Không được tắt nguồn máy khi đang xử lý lỗi này.
          2. Rút giắc nguồn 24V DC trên card DSP.
          3. Cắm lại giắc nguồn 24V DC trên card DSP.
          4. Kiểm tra lại hoạt động của DSP.
          5. Nếu vẫn lỗi, thay card DSP theo quy trình kỹ thuật.
        E05: |
          ⚠️ E05 – Lỗi đọc hình ảnh DSP.

          🔧 Hướng xử lý:
          1. Kiểm tra file RIP và kiểu máy có tương thích không.
          2. Load lại file RIP.
          3. Nếu vẫn lỗi, kiểm tra lại file hình ảnh và cấu hình máy.
        E09: |
          ⚠️ E09 – Lỗi bộ điều khiển DSP / lỗi đọc hình ảnh file.

          🔧 Hướng xử lý theo Subcode:
          - Subcode 15 – Hàng đợi in đầy:
            Hiệu chỉnh cảm biến nhận gạch đầu vào.
          - Subcode 16 – Nhóm in trống:
            Hiệu chỉnh cảm biến nhận gạch đầu vào.
          - Subcode 34 – Tham số có giá trị ngoài phạm vi:
            Kiểm tra khoảng cách giữa hai viên gạch, đặc biệt khi hai viên quá gần nhau.
          - Subcode 38 – Lưu trữ đồng bộ hóa máy chủ:
            Giảm tốc độ băng tải
          - Subcode 40 – Waveform chưa được khởi tạo:
            Tải lại waveform.
          - Nếu lỗi liên quan file in:
            Xóa tất cả file in và file test rồi RIP lại.
          - Nếu không hết lỗi, liên hệ KTV
        E11: |
          ⚠️ E11 – Báo lỗi cảm biến in.

          🔧 Hướng xử lý:
          1. Kiểm tra cảm biến in.
          2. Kiểm tra tốc độ giải mã DSP.
          3. Có thể xóa mẫu và Add lại mẫu hoặc khởi động lại máy in.
          4. Nếu không hết lỗi, liên hệ KTV.
        E14: >
          ⚠️ E14 – Nhiệt độ quá cao.

          🔧 Hướng xử lý: 1. Kiểm tra nhiệt độ trong bình mực 2. Lỗi xảy ra khi
          cảm biến nhiệt độ trong thùng cao hơn 85°C. 3. Kiểm tra lại cảm biến
          nhiệt độ bình mực ( có thể rút xoay jack cảm biến ra và cắm lại), để
          reset lại nhiệt độ. 4. Nếu rút jack ra cắm lại mà ko hết. KTV thay cảm
          biến nhiệt độ mới.
        E17: |
          ⚠️ E17 – Lỗi cấu hình CAN.

          🔧 Hướng xử lý:
          1. Kiểm tra cáp mạng CAN.
          2. Kiểm tra các đầu nối CAN.
          3. Nếu vẫn lỗi, kiểm tra cấu hình CAN.
        E18: |
          ⚠️ E18 – CAN không tìm thấy.

          🔧 Hướng xử lý:
          1. Kiểm tra cáp mạng CAN.
          2. Kiểm tra các đầu nối CAN.
          3. Kiểm tra xem node/thiết bị có được BẬT hay không.
          4. Nếu lỗi vẫn còn, thay card theo quy trình kỹ thuật.
       
        E22: >
          ⚠️ E22 – Lỗi thanh hút mực hoặc khay Cap hứng mực.

          🔧 Hướng xử lý:

          1. Kiểm tra thanh gạt hút vệ sinh đầu in đã về đúng vị trí chưa. Nếu
          chưa đúng liên hệ ktv căn chỉnh reset lại đểm gốc của thanh gạt.
          Mục: Configuration => Motor => Head Cleaner => Search For Zero Position => OK
          2. Kiểm tra khay Cap hứng mực đã về đúng vị trí chưa.
          3. Kiểm tra sensor vị trí báo ZZZ hoặc Giọt nước trên màn hình chính.
          4. Đưa đúng vị trí rồi Reset Alarm.
          5. Các bước trên kiểm tra đã Ok. Máy vẫn báo lỗi E22. Vào mục
          PLC => chọn Update Distribution => rồi khởi động lại máy in.
          6. Nếu không hoạt động, liên hệ KTV.

        E23: |
          ⚠️ E23 – Thời gian cấp mực cho ống quá dài.

          🔧 Hướng xử lý:
          1. Kiểm tra dòng mực từ thùng đến bình trên.
          2. Kiểm tra đường ống cấp mực.
          3. Kiểm tra khả năng cấp mực và tình trạng van/bơm nếu cần.
       
        E25: >
          ⚠️ E25 – Bảo vệ nhiệt Biến tần máy hút hoặc Bơm Degas

          🔧 Hướng xử lý:
          1. Kiểm tra aptomat (CB) của tủ điện phía sau xem có CB nào nhảy ko?
          2. Kiểm tra nguyên nhân gây bảo vệ nhiệt.
          3. Chỉ thao tác điện khi đã đảm bảo an toàn và cô lập nguồn theo quy
          trình.
          4. Nếu không hoạt động, liên hệ KTV.

        E27: |
          ⚠️ E27 – Khí nén yếu

          🔧 Hướng xử lý:
          1. Cấp đủ khí nén cho máy in từ 4,5 Bar.
          2. Kiểm tra đường ống khí nén có bị rò rỉ không.
          3. Báo Trực ca Cơ Điện kiểm tra nguồn khí nén nhà máy.
          4. Nếu không có khí nén vẫn muốn chạy máy in. hãy làm bước sau:
          ( cài đặt cảnh báo áp suất thấp từ 4,5Bar xuống 0 Bar)
             - Giảm áp suất cài đặt xuống 0 Bar.
             - Nhấn 2 lần phím P.
             - Cài N1 = 0.
             - Dùng phím lên/xuống để chỉnh giá trị.
          5. Nếu vẫn lỗi, liên hệ KTV.
          
        E31: >
          ⚠️ E31 – Dừng dòng trước thời gian trong hai lần giặt ở trạng thái "Tự
          động".

          🔧 Hướng xử lý: 
          1. Kiểm tra giá trị tham số. 
          2. Sửa đổi giá trị tham số theo quy trình kỹ thuật.
          3. Nếu không hoạt động, liên hệ KTV.
          
        E33: |
          ⚠️ E33 – Không thể làm sạch.

          🔧 Hướng xử lý:
          1. Kiểm tra thanh in đã được đặt đúng vị trí chưa.
          2. Đưa thanh in về đúng vị trí.
          3. Thực hiện lại quá trình làm sạch.
          
        E35: |
          ⚠️ E35 – Không thể nhập trạng thái in, bỏ qua kích hoạt.

          🔧 Hướng xử lý:
          1. Kiểm tra trạng thái máy.
          2. Kiểm tra điều kiện để chuyển sang trạng thái in.
          3. Kiểm tra các cảnh báo đang tồn tại.
          
        E37: |
          ⚠️ E37 – Không thể thực hiện quy trình làm sạch vì đang có báo động.

          🔧 Hướng xử lý:
          1. Kiểm tra các Alarm đang tồn tại.
          2. Xử lý nguyên nhân của Alarm trước.
          3. Sau khi hết Alarm, thực hiện lại quy trình làm sạch.
        E42: |
          ⚠️ E42 – Lỗi nội bộ trong quá trình khởi tạo card FirePulse.

          🔧 Hướng xử lý:
          1. Kiểm tra thiết bị FirePulse có được BẬT không.
          2. Kiểm tra hệ thống dây điện.
          3. Kiểm tra cấu hình các công tắc DIP.
          4. Nếu lỗi vẫn còn, thay card FirePulse theo quy trình kỹ thuật.
        E43: |
